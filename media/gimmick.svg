<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    .shake  { transform-origin: 200px 210px; animation: shake 5s infinite; }
    .lid    { transform-origin: 200px 112px; animation: lid 5s infinite; }
    .jack   { animation: jack 5s infinite; }
    .label  { animation: label 5s infinite; }
    @keyframes shake {
      0%, 4%   { transform: rotate(0); }
      7%       { transform: rotate(-4deg); }
      10%      { transform: rotate(4deg); }
      13%      { transform: rotate(-5deg); }
      16%      { transform: rotate(5deg); }
      19%      { transform: rotate(-6deg); }
      22%      { transform: rotate(6deg); }
      25%      { transform: rotate(-3deg); }
      28%, 100% { transform: rotate(0); }
    }
    @keyframes lid {
      0%, 30%  { transform: none; opacity: 1; }
      40%      { transform: translate(130px, -160px) rotate(70deg); opacity: 0; }
      92%      { transform: translate(130px, -160px) rotate(70deg); opacity: 0; }
      96%, 100% { transform: none; opacity: 1; }
    }
    @keyframes jack {
      0%, 31%  { transform: translateY(130px); }
      38%      { transform: translateY(-6px); }
      42%      { transform: translateY(6px); }
      46%      { transform: translateY(-3px); }
      50%, 88% { transform: translateY(0); }
      94%, 100% { transform: translateY(130px); }
    }
    @keyframes label {
      0%, 44%  { opacity: 0; }
      50%, 88% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="above-box"><rect x="0" y="0" width="400" height="121"/></clipPath>
  </defs>

  <rect width="400" height="260" rx="20" fill="#6c4cf1"/>

  <g class="shake">
    <!-- Troldmanden i kassen -->
    <g clip-path="url(#above-box)">
      <g class="jack">
        <polyline points="200,130 186,122 214,114 186,106 214,98 200,92" fill="none" stroke="#e5e7eb" stroke-width="5" stroke-linejoin="round"/>
        <line x1="200" y1="50" x2="200" y2="38" stroke="#78350f" stroke-width="4"/>
        <rect x="118" y="8" width="164" height="30" rx="6" fill="#fff"/>
        <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ef4444">NICE TRY!</text>
        <circle cx="200" cy="70" r="22" fill="#fde047"/>
        <circle cx="192" cy="64" r="3" fill="#1f1b2e"/>
        <path d="M204 64 h7" stroke="#1f1b2e" stroke-width="3" stroke-linecap="round"/>
        <path d="M188 76 q12 10 24 0" fill="none" stroke="#1f1b2e" stroke-width="3" stroke-linecap="round"/>
        <path d="M201 80 q5 10 10 0 z" fill="#ef4444"/>
      </g>
    </g>

    <!-- Kassen -->
    <rect x="140" y="120" width="120" height="90" rx="8" fill="#f59e0b"/>
    <rect x="190" y="120" width="20" height="90" fill="#ef4444"/>

    <!-- Låget -->
    <g class="lid">
      <rect x="130" y="100" width="140" height="24" rx="6" fill="#fbbf24"/>
      <rect x="190" y="100" width="20" height="24" fill="#ef4444"/>
      <path d="M200 100 C 170 65, 140 85, 175 100 Z M200 100 C 230 65, 260 85, 225 100 Z" fill="#ef4444"/>
    </g>
  </g>

  <text class="label" x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff">Din præmie: ingenting 🙃</text>
</svg>
