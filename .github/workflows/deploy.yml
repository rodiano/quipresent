name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add cache-busting version to asset URLs
        run: |
          sed -i -E "s#(href|src)=\"(style\.css|app\.js|quiz-config\.js)\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" index.html
          grep -nE 'style.css|app.js|quiz-config' index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
